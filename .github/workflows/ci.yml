name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: bash scripts/check-no-bnnett.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # This invokes the ordinary credential-free native-host build. It never
      # calls the separate --release-manager-launcher private-signer path.
      - name: Build without a private manager signer
        run: npm run build
      - name: Verify canonical signed launcher and fixed-action manager bundle
        run: node scripts/verify-release.mjs --manager-artifacts
      - name: Verify deterministic generated files are committed
        run: |
          # Native support binaries are compiled and ad-hoc signed with the
          # runner's Xcode SDK and Node headers, so their Mach-O bytes are
          # environment-specific. The runtime fingerprint intentionally covers
          # those exact bytes and changes with the same runner-specific inputs.
          git diff --exit-code -- \
            store/index.json \
            packages/installer/assets/runtime \
            ':(exclude)packages/installer/assets/runtime/native/tweaker_native_host.node' \
            ':(exclude)packages/installer/assets/runtime/native/Tweakers Doctor.app/Contents/MacOS/Tweakers Doctor' \
            ':(exclude)packages/installer/assets/runtime/.manager-support/app-launcher/Tweakers App Launcher' \
            ':(exclude)packages/installer/assets/runtime/.manager-support/swap-helper/Tweakers Swap Helper.app/Contents/MacOS/Tweakers Swap Helper' \
            ':(exclude)packages/installer/assets/runtime/runtime-fingerprint.json'
          git diff --exit-code -- \
            packages/native-host/assets/'Tweakers Manager Launcher' \
            packages/installer/assets/manager-launcher \
            ':(exclude)packages/installer/assets/manager-launcher/manager.mjs'
          node scripts/verify-release.mjs --generated-manager-bundle
      - name: Verify canonical tweak catalog remains synchronized
        run: npm run sync:tweaks -- --check
