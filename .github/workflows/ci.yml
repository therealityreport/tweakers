name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: bash scripts/check-no-bnnett.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify deterministic generated files are committed
        run: |
          # The native host is compiled and ad-hoc signed with the runner's
          # Xcode SDK and Node headers, so its Mach-O bytes are environment-specific.
          git diff --exit-code -- \
            store/index.json \
            packages/installer/assets/runtime \
            ':(exclude)packages/installer/assets/runtime/native/codexpp_native_host.node'
